name: CI - Build and API Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven (package only, skip built-in tests)
        run: mvn -B clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Start ParaBank, wait for it, run Newman tests, then stop it
        run: |
          nohup mvn -B cargo:start > cargo.log 2>&1 &

          ready=0
          for i in $(seq 1 30); do
            code=$(curl -sL -o /dev/null -w "%{http_code}" http://localhost:8080/parabank/ || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "ParaBank is up (HTTP $code)"
              ready=1
              break
            fi
            echo "Waiting for ParaBank... (attempt $i, got HTTP $code)"
            sleep 5
          done

          if [ "$ready" != "1" ]; then
            echo "ParaBank did not start in time"
            cat cargo.log
            exit 1
          fi

          echo "Giving Tomcat a few more seconds to stabilize..."
          sleep 10

          newman run "postman/ParaBank API.postman_collection.json" \
            -e "postman/ParaBank Local.postman_environment.json" \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml
          newman_exit=$?

          if [ "$newman_exit" != "0" ]; then
            echo "----- cargo.log (Tomcat/ParaBank server log) -----"
            cat cargo.log
            echo "---------------------------------------------------"
          fi

          mvn -B cargo:stop || true

          exit $newman_exit

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.xml
