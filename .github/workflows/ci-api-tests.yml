name: CI - Build and API Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven (package only, skip built-in tests)
        run: mvn -B clean package -DskipTests

      - name: Start ParaBank via Cargo (Tomcat + HSQLDB)
        run: nohup mvn -B cargo:start > cargo.log 2>&1 &

      - name: Wait for ParaBank to be ready
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/parabank/)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "ParaBank is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for ParaBank... (attempt $i, got HTTP $code)"
            sleep 5
          done
          echo "ParaBank did not start in time"
          cat cargo.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman API tests via Newman
        run: |
          newman run "postman/ParaBank API.postman_collection.json" \
            -e "postman/ParaBank Local.postman_environment.json" \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml

      - name: Stop ParaBank
        if: always()
        run: mvn -B cargo:stop || true

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.xml
